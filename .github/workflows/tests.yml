name: Tests

on:
  push:
    branches: [ master ]
    # Documentation-only commits cannot change test results, and the matrix is
    # six jobs wide.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ '**' ]

# A newer push to the same branch supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    name: Node v${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor: archiver 8 is ESM-only and lib/stream/xlsx
        # reaches it through require(esm), which Node gained in 22.12 and
        # 20.19. Node 18 went end-of-life in April 2025 and Node 20 in April
        # 2026, so neither is tested here any more.
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./npm-cache
          key: v1-${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            v1-${{ runner.os }}-node-${{ matrix.node-version }}-npm-
      - run: npm ci
      # Deliberately not `npm test`: test:full also runs the jasmine browser
      # suite, which needs Chromium via Puppeteer. Puppeteer's install script
      # is skipped under npm's current default script policy, so browser
      # coverage is unavailable in CI. See CONTRIBUTING.md.
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:end-to-end

  benchmark:
    timeout-minutes: 15
    name: Measure performance impact of changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./npm-cache
          key: v1-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            v1-npm-
      - run: npm ci
      - run: npm run benchmark
        env:
          CI: true

  bundle-size:
    timeout-minutes: 15
    name: Keep the browser bundle within budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./npm-cache
          key: v1-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            v1-npm-
      - run: npm ci
      - run: npm run build
      # A bundle that grows still passes every functional test. This is the
      # only job that would have caught the 19 KB gzip regression in 4.6.0.
      - run: npm run test:size
        env:
          CI: true

  typescript:
    timeout-minutes: 15
    name: Ensure typescript compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./npm-cache
          key: v1-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            v1-npm-
      - run: npm ci
      - run: npm install typescript
      # index.ts imports ./dist/es5, which only exists after a build.
      - run: npm run build
      # Compile through tsconfig.json rather than naming files on the command
      # line: TypeScript 5.x rejects that combination with TS5112, and going
      # through the project file works on every version.
      - run: npx tsc -p tsconfig.json --noEmit
        env:
          CI: true
      - run: npm run test:typescript
        env:
          CI: true
